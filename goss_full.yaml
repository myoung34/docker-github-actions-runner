command:
  /bin/bash -c 'curl(){ printf %s "{\"token\":\"abc\"}"; }; export -f curl; ACCESS_TOKEN=123 RUNNER_SCOPE=org ORG_NAME=myoung34 GITHUB_HOST=github.example.com GITHUB_API_HOST=api.github.example.com GITHUB_API_PATH=/foo /token.sh':
    exit-status: 0
    stdout:
      - '"full_url": "https://api.github.example.com/foo/orgs/myoung34/actions/runners/registration-token"'
    stderr: ""
    timeout: 2000

  /entrypoint.sh something:
    exit-status: 0
    stdout:
      - "Runner reusage is disabled"
      - ""
      - "Disable automatic registration: true"
      - "Random runner suffix: true"
      - "Runner workdir: /tmp/a"
      - "Runner name: huzzah"
      - "Labels: blue,green"
      - "Runner Group: wat"
      - "Github Host: github.example.com"
      - "Run as root:true"
      - "Start docker: false"
      - "Running something"
    stderr: ""
    timeout: 2000

  /actions-runner/externals/node20/bin/node -e 'console.log("node20 runtime works")':
    exit-status: 0
    stdout:
      - "node20 runtime works"
    stderr: ""
    timeout: 5000

  /actions-runner/externals/node24/bin/node -e 'console.log("node24 runtime works")':
    exit-status: 0
    stdout:
      - "node24 runtime works"
    stderr: ""
    timeout: 5000

file:
  /actions-runner/externals/node20/bin/node:
    exists: true
    filetype: file

  /actions-runner/externals/node20/lib/node_modules/npm:
    exists: false

  /actions-runner/externals/node20/lib/node_modules/corepack:
    exists: false

  /actions-runner/externals/node20/bin/npm:
    exists: false

  /actions-runner/externals/node20/bin/npx:
    exists: false

  /actions-runner/externals/node20/bin/corepack:
    exists: false

  /actions-runner/externals/node24/bin/node:
    exists: true
    filetype: file

  /actions-runner/externals/node24/lib/node_modules/npm:
    exists: false

  /actions-runner/externals/node24/lib/node_modules/corepack:
    exists: false

  /actions-runner/externals/node24/bin/npm:
    exists: false

  /actions-runner/externals/node24/bin/npx:
    exists: false

  /actions-runner/externals/node24/bin/corepack:
    exists: false
