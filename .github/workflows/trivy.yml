name: Trivy
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * *' # nightly image scan (tags are rebuilt nightly)
    - cron: '0 12 * * 0' # Sunday, ahead of the Monday Zapier digest
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        variant: [-ubuntu-jammy, -ubuntu-noble, -ubuntu-resolute, -debian-bookworm, -debian-trixie]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Floating tag (rebuilt nightly)
        env:
          VARIANT: ${{ matrix.variant }}
        run: echo "TAG=${VARIANT#-}" >> "$GITHUB_ENV"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: myoung34/github-runner:${{ env.TAG }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml
      - name: Prefix SARIF locations with the variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          # Only OS packages (uri = image name) differ per variant; binaries share one alert.
          jq --arg v "${VARIANT#-}" '(.runs[].results[].locations[].physicalLocation.artifactLocation.uri) |= if . == "myoung34/github-runner" then "\($v)/\(.)" else . end' \
            trivy.sarif > trivy.tmp && mv trivy.tmp trivy.sarif
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy.sarif
          category: trivy${{ matrix.variant }}

  # Repo files: Dockerfiles, workflows, committed secrets.
  fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy.sarif
          trivyignores: .trivyignore.yaml
      # Fork PRs get a read-only token, so the upload would fail there.
      - if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy.sarif
          category: trivy-fs

  report:
    needs: [image, fs]
    if: ${{ !cancelled() && (github.event.schedule == '0 12 * * 0' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      security-events: read
    steps:
      - name: Send open Trivy alerts to the Zapier digest
        env:
          GH_TOKEN: ${{ github.token }}
          ZAPIER_HOOK: ${{ secrets.ZAPIER_TRIVY_HOOK }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&tool_name=Trivy&per_page=100" \
            --jq '.[] | .rule.security_severity_level // .rule.severity' \
          | jq -R . | jq -s \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/security/code-scanning?query=is%3Aopen+tool%3ATrivy" \
              '(group_by(.) | map("\(.[0]) \(length)") | join(", ")) as $by
               | {repo: $repo, total: length, url: $url,
                  summary: "\($repo): \(length) open\(if length > 0 then " (\($by))" else "" end)"}' \
          | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$ZAPIER_HOOK"
