name: Trivy image scan
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [-ubuntu-jammy, -ubuntu-noble, -ubuntu-resolute, -debian-bookworm, -debian-trixie]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Floating tag (rebuilt nightly)
        env:
          VARIANT: ${{ matrix.variant }}
        run: echo "TAG=${VARIANT#-}" >> "$GITHUB_ENV"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: myoung34/github-runner:${{ env.TAG }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml
      - name: Prefix SARIF locations with the variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          # Only OS packages (uri = image name) differ per variant; binaries share one alert.
          jq --arg v "${VARIANT#-}" '(.runs[].results[].locations[].physicalLocation.artifactLocation.uri) |= if . == "myoung34/github-runner" then "\($v)/\(.)" else . end' \
            trivy.sarif > trivy.tmp && mv trivy.tmp trivy.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy${{ matrix.variant }}

  notify:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    permissions:
      security-events: read
    steps:
      - name: Post one Slack summary
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set, skipping"; exit 0; fi
          counts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&tool_name=Trivy&per_page=100" \
            --jq '.[] | .rule.security_severity_level // "unrated"' | sort | uniq -c | awk '{printf "%s%s %s", sep, $1, $2; sep=", "}')
          text="Trivy scan (${{ needs.scan.result }}): open alerts: ${counts:-none}. $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/security/code-scanning?query=tool%3ATrivy"
          jq -n --arg text "$text" '{text: $text}' | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
