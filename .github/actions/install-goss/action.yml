name: Install Goss and dgoss
description: Install goss and dgoss from the goss-org/goss release tarball, verified against SHA256SUMS
inputs:
  goss-version:
    description: goss release tag, for example v0.4.10
    required: true
  platform:
    description: Target architecture, amd64 or arm64
    required: true
runs:
  using: composite
  steps:
    - name: Install Goss and dgoss
      shell: bash
      env:
        GOSS_VERSION: ${{ inputs.goss-version }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail

        VERSION="$GOSS_VERSION"
        BIN_DIR="$HOME/.local/bin"

        mkdir -p "$BIN_DIR"
        echo "$BIN_DIR" >> "$GITHUB_PATH"

        ARCH="$PLATFORM"
        if [ "$ARCH" != "amd64" ] && [ "$ARCH" != "arm64" ]; then
          echo "Unsupported platform: $ARCH"
          exit 1
        fi

        # goss >=0.4.10 ships tarballs named with x86_64 instead of amd64
        GOSS_ARCH="$ARCH"
        if [ "$ARCH" = "amd64" ]; then GOSS_ARCH="x86_64"; fi
        BASE="https://github.com/goss-org/goss/releases/download/${VERSION}"
        TARBALL="goss_${VERSION#v}_linux_${GOSS_ARCH}.tar.gz"
        TMP="$(mktemp -d)"
        curl -fsSL -o "$TMP/$TARBALL" "$BASE/$TARBALL"
        curl -fsSL -o "$TMP/SHA256SUMS" "$BASE/goss_${VERSION#v}_SHA256SUMS"
        (cd "$TMP" && sha256sum -c --ignore-missing SHA256SUMS)
        tar -xzf "$TMP/$TARBALL" -C "$BIN_DIR" goss

        curl -fsSL \
          -o "$BIN_DIR/dgoss" \
          "https://github.com/goss-org/goss/releases/download/${VERSION}/dgoss"

        chmod +x "$BIN_DIR/goss" "$BIN_DIR/dgoss"

        "$BIN_DIR/goss" --version
